<div class="card dashboard-card h-100">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <p class="text-secondary mb-1">

                    {{ title }}

                </p>

                <h2 class="fw-bold">

                    {{ value }}

                </h2>

                <small class="text-success">

                    {{ growth }}

                </small>

            </div>

            <div class="dashboard-icon">

                <i class="bi {{ icon }}"></i>

            </div>

        </div>

    </div>

</div>
