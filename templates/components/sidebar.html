<div class="sidebar">

    <!-- Logo -->
    <div class="sidebar-header">

        <h4 class="fw-bold text-white">

            SmartCRM

        </h4>

        <small class="text-light">

            Customer Relationship Platform

        </small>

    </div>

    <!-- Dashboard -->
    <div class="sidebar-group">

        <div class="sidebar-title">

            MAIN

        </div>

        <a href="{{ url_for('main.home') }}"
           class="sidebar-link {% if request.endpoint == 'main.home' %}active{% endif %}">

            <i class="bi bi-speedometer2"></i>

            Dashboard

        </a>

    </div>

    {% if current_user.role == "Owner" %}

    <div class="sidebar-group">

        <div class="sidebar-title">

            ADMINISTRATION

        </div>

        <a href="{{ url_for('user.index') }}"
           class="sidebar-link">

            <i class="bi bi-people-fill"></i>

            Users

        </a>
        
    </div>

    {% endif %}

    <!-- Sales -->

    <div class="sidebar-group">

        <div class="sidebar-title">

            SALES

        </div>

        <a href="{{ url_for('customer.index') }}"
           class="sidebar-link {% if request.endpoint.startswith('customer.') %}active{% endif %}">

            <i class="bi bi-people"></i>

            Customers

        </a>

        <a href="#" class="sidebar-link">

            <i class="bi bi-person-lines-fill"></i>

            Leads

        </a>

        <a href="#" class="sidebar-link">

            <i class="bi bi-cash-stack"></i>

            Deals

        </a>

    </div>

    <!-- Productivity -->

    <div class="sidebar-group">

        <div class="sidebar-title">

            PRODUCTIVITY

        </div>

        <a href="#" class="sidebar-link">

            <i class="bi bi-calendar-event"></i>

            Calendar

        </a>

        <a href="#" class="sidebar-link">

            <i class="bi bi-check2-square"></i>

            Tasks

        </a>

    </div>

    <!-- Analytics -->

    <div class="sidebar-group">

        <div class="sidebar-title">

            ANALYTICS

        </div>

        <a href="#" class="sidebar-link">

            <i class="bi bi-bar-chart"></i>

            Reports

        </a>

    </div>

    <!-- System -->

    <div class="sidebar-group">

        <div class="sidebar-title">

            SYSTEM

        </div>

        <a href="#" class="sidebar-link">

            <i class="bi bi-gear"></i>

            Settings

        </a>

        <a href="{{ url_for('auth.logout') }}"
           class="sidebar-link">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </a>

    </div>

</div>
