{% extends "base.html" %}

{% block title %}
Users
{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4">

User Management

</h2>

<table class="table">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Role</th>

<th>Status</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ user.full_name }}</td>

<td>{{ user.email }}</td>

<td>{{ user.role }}</td>

<td>{{ user.status }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
