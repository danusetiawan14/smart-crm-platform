{% extends "base.html" %}

{% block title %}
Create Customer
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            Create Customer
        </h2>

        <p class="text-secondary">
            Add a new customer into SmartCRM
        </p>

    </div>

    <a href="{{ url_for('customer.index') }}"
       class="btn btn-secondary">

        Back

    </a>

</div>

<div class="crm-card">

<form>

<div class="row g-4">

<div class="col-md-6">

<label class="form-label">

Company Name

</label>

<input
class="form-control"
type="text">

</div>

<div class="col-md-6">

<label class="form-label">

Contact Person

</label>

<input
class="form-control"
type="text">

</div>

<div class="col-md-6">

<label class="form-label">

Phone

</label>

<input
class="form-control"
type="text">

</div>

<div class="col-md-6">

<label class="form-label">

Email

</label>

<input
class="form-control"
type="email">

</div>

<div class="col-md-6">

<label class="form-label">

Website

</label>

<input
class="form-control"
type="text">

</div>

<div class="col-md-6">

<label class="form-label">

Industry

</label>

<select class="form-select">

<option>

Technology

</option>

<option>

Retail

</option>

<option>

Manufacturing

</option>

<option>

Healthcare

</option>

<option>

Education

</option>

</select>

</div>

<div class="col-12">

<label class="form-label">

Address

</label>

<textarea
class="form-control"
rows="4"></textarea>

</div>

<div class="col-md-6">

<label class="form-label">

Status

</label>

<select class="form-select">

<option>

Prospect

</option>

<option>

Active

</option>

<option>

Inactive

</option>

</select>

</div>

<div class="col-12">

<button
class="btn btn-primary">

Save Customer

</button>

<a
href="{{ url_for('customer.index') }}"
class="btn btn-secondary">

Cancel

</a>

</div>

</div>

</form>

</div>

{% endblock %}
