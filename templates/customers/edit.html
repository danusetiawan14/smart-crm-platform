{% extends "base.html" %}

{% block title %}
Create Customer
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            Edit Customer
        </h2>

        <p class="text-secondary">
            Add a new customer into SmartCRM
        </p>

    </div>

    <a href="{{ url_for('customer.index') }}"
       class="btn btn-secondary">

        Back

    </a>

</div>

<div class="crm-card">

<form method="POST"
      action="{{ url_for('customer.update', id=customer.id) }}">

<div class="row g-4">

<div class="col-md-6">

<label class="form-label">

Company Name

</label>

<input
type="text"
name="company_name"
class="form-control"
value="{{ customer.company_name }}">

</div>

<div class="col-md-6">

<label class="form-label">

Contact Person

</label>

<input
type="text"
name="contact_person"
class="form-control"
value="{{ customer.contact_person }}">

</div>

<div class="col-md-6">

<label class="form-label">

Phone

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ customer.phone }}">

</div>

<div class="col-md-6">

<label class="form-label">

Email

</label>

<input
type="text"
name="email"
class="form-control"
value="{{ customer.email }}">

</div>

<div class="col-md-6">

<label class="form-label">

Website

</label>

<input
type="text"
name="website"
class="form-control"
value="{{ customer.website }}">

</div>

<div class="col-md-6">

<label class="form-label">

Industry

</label>

<select
name="industry"
class="form-select">

<option>

Technology

</option>

<option>

Retail

</option>

<option>

Manufacturing

</option>

<option>

Healthcare

</option>

<option>

Education

</option>

</select>

</div>

<div class="col-12">

<label class="form-label">

Address

</label>

<textarea
name="address"
class="form-control"
rows="4">{{ customer.address }}</textarea>

</div>

<div class="col-md-6">

<label class="form-label">

Status

</label>

<select
name="status"
class="form-select">

<option
value="Prospect"
{% if customer.status=="Prospect" %}selected{% endif %}>
Prospect
</option>

<option
value="Active"
{% if customer.status=="Active" %}selected{% endif %}>
Active
</option>

<option
value="Inactive"
{% if customer.status=="Inactive" %}selected{% endif %}>
Inactive
</option>

</select>

</div>

<div class="col-12">

<button
class="btn btn-primary">

Save Customer

</button>

<a
href="{{ url_for('customer.index') }}"
class="btn btn-secondary">

Cancel

</a>

</div>

</div>

</form>

</div>

{% endblock %}
